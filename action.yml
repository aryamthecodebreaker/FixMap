name: FixMap
description: Map pull request changes to primary context, likely impact, test routes, and review risks.
inputs:
  mode:
    description: >-
      plan (default) maps the change to context files, likely impact, test routes, and review risks.
      verify compares a saved plan against the diff that followed it and needs report-path.
      annotate manages local annotation notes using annotation-request and emits JSON without GitHub comments.
      Explain and compare are available through the CLI's plan --explain/--compare flags and MCP tools;
      they are intentionally not Action modes because Action comments operate on complete reports.
    required: false
    default: plan
  annotation-request:
    description: 'Annotate mode only. JSON with action list, add (scope, note, optional owner/expiresAt), or remove (id). Maximum 32 KiB. Never interpolate untrusted PR text into write requests.'
    required: false
  allow-annotation-write:
    description: 'Explicit opt-in for annotate add/remove. Only changes the local checkout; does not commit or push.'
    required: false
    default: "false"
  report-path:
    description: >-
      Verify mode only. Path to the JSON plan this change was made from, usually restored
      from an artifact saved by an earlier plan step.
    required: false
  fail-on:
    description: >-
      Verify mode only. error (default) fails only on error findings; warning also fails
      when verification raises advisory warnings such as no-test-changed.
    required: false
    default: error
  issue:
    description: >-
      Issue, prompt, or review context for FixMap. Accepts a public GitHub issue or pull
      request URL, whose title and body are fetched as task text.
    required: false
  diff:
    description: Git diff spec, such as main...HEAD.
    required: false
  base:
    description: Base ref for diffing when diff is not provided.
    required: false
  head:
    description: Head ref for diffing when diff is not provided.
    required: false
  limit:
    description: Maximum context files in plan mode, from 1 to 20.
    required: false
  exclude:
    description: >-
      Comma- or newline-separated path patterns to exclude, plan mode only; setting it in
      verify mode is an error. Patterns use the gitignore subset FixMap documents in its
      README, where brace groups such as {a,b} are literals rather than alternation. Prefer
      newline-separated patterns: a brace group containing a comma is kept intact, but
      newlines make the intent unambiguous.
    required: false
  working-tree:
    description: Map or verify staged and unstaged tracked changes against HEAD.
    required: false
    default: "false"
  include-untracked:
    description: With working-tree, include untracked files.
    required: false
    default: "false"
  no-cache:
    description: Bypass the exact-state repository scan cache and perform a fresh scan.
    required: false
    default: "false"
  format:
    description: >-
      Output format. JSON is posted as a fenced JSON pull-request comment, and the step
      summary carries the readable report with the JSON appended in a collapsed block.
    required: false
    default: markdown
  github-token:
    description: Token used to upsert a pull request comment. If neither this input nor GITHUB_TOKEN is set, FixMap only writes the step summary.
    required: false
  comment-author:
    description: Optional GitHub login used to disambiguate prior FixMap comments when multiple marked comments exist.
    required: false
  change-scope-touch:
    description: >-
      Preview. Plan mode only. Newline- or comma-separated repository files or directories you
      intend to change. FixMap expands them over repository import edges with the same Core
      engine as fixmap change-scope and adds a bounded "Change scope" section (selected,
      affected, unresolved, and truncated counts plus the top affected paths) to the readable
      report and pull request comment. The JSON report is unchanged.
    required: false
  change-scope-add:
    description: >-
      Preview. Plan mode only. Newline- or comma-separated paths you plan to add. Missing paths
      stay unresolved anchors rather than invented evidence. Combines with change-scope-touch.
    required: false
  capability:
    description: >-
      Preview. Plan mode only. One capability id from .fixmap/capabilities.json. FixMap rebuilds
      that capability's current map and adds a "Capability" section; on pull requests with both
      refs fetched it also compares the base and head maps from Git objects without a checkout.
      A missing or invalid store degrades to a warning. Read-only: the Action never writes the
      store.
    required: false
outputs:
  report:
    description: The bounded FixMap report, or verification, in the selected format.
  context-count:
    description: Number of context files returned. Plan mode only.
  test-route-count:
    description: Number of test routes returned. Plan mode only.
  finding-count:
    description: Number of verification findings raised. Verify mode only.
  changed-file-count:
    description: Number of changed files compared against the plan. Verify mode only.
  change-scope-affected-count:
    description: Preview. Number of affected paths in the change scope. Set only when change-scope-touch or change-scope-add is used.
branding:
  icon: map
  color: green
runs:
  using: node24
  main: packages/action/dist/index.mjs
