name: FixMap
description: Map pull request changes to context files, test routes, and review risks.
inputs:
  mode:
    description: >-
      plan (default) maps the change to context files, test routes, and review risks.
      verify compares a saved plan against the diff that followed it and needs report-path.
      Explain and compare are intentionally CLI/MCP-only because Action comments operate on complete reports.
    required: false
    default: plan
  report-path:
    description: >-
      Verify mode only. Path to the JSON plan this change was made from, usually restored
      from an artifact saved by an earlier plan step.
    required: false
  fail-on:
    description: >-
      Verify mode only. error (default) fails only on error findings; warning also fails
      when verification raises advisory warnings such as no-test-changed.
    required: false
    default: error
  issue:
    description: >-
      Issue, prompt, or review context for FixMap. Accepts a public GitHub issue or pull
      request URL, whose title and body are fetched as task text.
    required: false
  diff:
    description: Git diff spec, such as main...HEAD.
    required: false
  base:
    description: Base ref for diffing when diff is not provided.
    required: false
  head:
    description: Head ref for diffing when diff is not provided.
    required: false
  limit:
    description: Maximum context files in plan mode, from 1 to 20.
    required: false
  exclude:
    description: >-
      Comma- or newline-separated path patterns to exclude, plan mode only; setting it in
      verify mode is an error. Patterns use the gitignore subset FixMap documents in its
      README, where brace groups such as {a,b} are literals rather than alternation. Prefer
      newline-separated patterns: a brace group containing a comma is kept intact, but
      newlines make the intent unambiguous.
    required: false
  working-tree:
    description: Map or verify staged and unstaged tracked changes against HEAD.
    required: false
    default: "false"
  include-untracked:
    description: With working-tree, include untracked files.
    required: false
    default: "false"
  no-cache:
    description: Bypass the exact-state repository scan cache and perform a fresh scan.
    required: false
    default: "false"
  format:
    description: >-
      Output format. JSON is posted as a fenced JSON pull-request comment, and the step
      summary carries the readable report with the JSON appended in a collapsed block.
    required: false
    default: markdown
  github-token:
    description: Token used to upsert a pull request comment. If neither this input nor GITHUB_TOKEN is set, FixMap only writes the step summary.
    required: false
  comment-author:
    description: Optional GitHub login used to disambiguate prior FixMap comments when multiple marked comments exist.
    required: false
outputs:
  report:
    description: The bounded FixMap report, or verification, in the selected format.
  context-count:
    description: Number of context files returned. Plan mode only.
  test-route-count:
    description: Number of test routes returned. Plan mode only.
  finding-count:
    description: Number of verification findings raised. Verify mode only.
  changed-file-count:
    description: Number of changed files compared against the plan. Verify mode only.
branding:
  icon: map
  color: green
runs:
  using: node24
  main: dist/index.mjs
