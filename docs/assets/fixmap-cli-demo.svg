<svg xmlns="http://www.w3.org/2000/svg" width="860" height="830" viewBox="0 0 860 830" role="img" aria-label="Animated terminal recording: one fixmap plan command produces ranked context files, a test route, an authentication risk note, and empty-state diagnostics.">
