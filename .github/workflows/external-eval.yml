name: external-eval

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name != 'schedule' || github.repository == 'aryamthecodebreaker/FixMap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: node scripts/evaluate-external.mjs --gate --check-recorded
      - run: node scripts/evaluate-external.mjs --suite heldout --gate --check-recorded
      - run: node scripts/evaluate-baseline.mjs --suite external --check-recorded
      - run: node scripts/evaluate-baseline.mjs --suite heldout --check-recorded
