name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  compatibility:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20.11"
          - os: ubuntu-latest
            node: "22"
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify packed annotation consumer
        shell: pwsh
        run: |
          npm run build --workspace @aryam/fixmap
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed' }
          $consumerRoot = Join-Path $env:RUNNER_TEMP ('fixmap-consumer-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $consumerRoot | Out-Null
          $corePack = npm pack --workspace @aryam/fixmap-core --pack-destination $consumerRoot --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Core pack failed' }
          $cliPack = npm pack --workspace @aryam/fixmap --pack-destination $consumerRoot --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'CLI pack failed' }
          $coreTarball = Join-Path $consumerRoot $corePack[0].filename
          $cliTarball = Join-Path $consumerRoot $cliPack[0].filename
          npm install --prefix $consumerRoot --ignore-scripts --no-audit --no-fund $coreTarball $cliTarball
          if ($LASTEXITCODE -ne 0) { throw 'Consumer install failed' }
          node scripts/check-annotation-consumer.mjs $consumerRoot
          if ($LASTEXITCODE -ne 0) { throw 'Packed annotation consumer failed' }
      - name: Verify local rationale across CLI Action and MCP
        shell: pwsh
        run: |
          npm run build:action
          if ($LASTEXITCODE -ne 0) { throw 'Action build failed' }
          node scripts/check-decision-surfaces.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Rationale process acceptance failed' }
